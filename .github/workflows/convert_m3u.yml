name: convert_m3u

on:
  push:
    paths:
      - 'convert_m3u.py'
      - '.github/workflows/convert_m3u.yml'
      - 'success_urls.txt'
  workflow_dispatch:
  schedule:
    # 每天北京时间 16:30 自动运行 (对应 UTC 08:30)
    - cron: '30 8 * * *'

jobs:
  run-converter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Conversion Script
        run: python convert_m3u.py

      - name: Commit and Push Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update playlist.m3u [skip ci]" && git pull --rebase origin main && git push)
