name: scan_site_files

on:
  push:
    paths:
      - 'scan_site_files.py'
      - '.github/workflows/scan_site_files.yml'
      - 'url.txt'
  workflow_dispatch:
  schedule:
    # 每天北京时间 16:30 自动运行 (对应 UTC 08:30)
    - cron: '30 8 * * *'

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scan Script
        run: python scan_site_files.py

      - name: Commit and Push CSV Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add success_urls.txt
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update site_files_scan.csv [skip ci]" && git push)
