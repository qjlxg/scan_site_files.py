name: scan_site_files

on:
  push:
    paths:
      - 'scan_site_files.py'
      - '.github/workflows/scan_site_files.yml'
      - 'url.txt'
  workflow_dispatch:
  schedule:
    # 每天北京时间 16:30 自动运行 (对应 UTC 08:30)
    - cron: '30 8 * * *'

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    # 赋予仓库写权限以允许 git push
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scan Script
        run: python scan_site_files.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add success_urls.txt site_files_scan.csv
          
          # 使用 status --porcelain 检查是否有任何改动（包括新生成的文件）
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-update success_urls and scan results [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit"
          fi
