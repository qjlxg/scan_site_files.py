name: fetch-nodes

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'hunter_node_extract.py' 
      - 'scan_results.csv' 
      - '.github/workflows/fetch_nodes.yml'
 # schedule:
    # 北京时间每天早上 8:30 自动运行（UTC 时间 0:30）
   # - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run-fetch-nodes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai 
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp pyyaml requests

      - name: 运行节点抓取与统计脚本
        run: |
          python hunter_node_extract.py

      - name: 自动提交并推送节点与统计变动
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 提交 data 目录下的常规统计/URL文件，同时提交 archive 目录下新生成的带时间戳 yaml 文件
          git add data/unique_stats.csv data/unique_urls.txt archive/
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update nodes and statistics [skip ci]" && git push)
